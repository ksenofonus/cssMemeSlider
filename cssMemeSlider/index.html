<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cssMemeSlider</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="wrapper">
    <div class="slider_wrapper">
      <div class="slider_top">
        <input type="radio" name="control" id="ctrl1" checked></input>
        <input type="radio" name="control" id="ctrl2"></input>
        <input type="radio" name="control" id="ctrl3"></input>
        <input type="radio" name="control" id="ctrl4"></input>
        <input type="radio" name="control" id="ctrl5"></input>
        <div class="slider__control">
          <div class="slider__item item1">
            <img src="./assets/image/mem1.jpg" alt="Mem1">
          </div>
          <div class="slider__item">
            <img src="./assets/image/mem2.jpg" alt="Meme2">
          </div>
          <div class="slider__item">
            <img src="./assets/image/mem3.jpg" alt="Meme3">
          </div>
          <div class="slider__item">
            <img src="./assets/image/mem4.jpg" alt="Meme4">
          </div>
          <div class="slider__item">
            <img src="./assets/image/mem5.jpg" alt="Meme5">
          </div>
        </div>
        <div class="slider__bottom">
          <div class="slider__text">
            <div class="slider__text_container">
              <div class="slider_text-wrap">
                <h2 class="slider_name">Meme1</h2>
                <h2 class="slider_name">Meme2</h2>
                <h2 class="slider_name">Meme3</h2>
                <h2 class="slider_name">Meme4</h2>
                <h2 class="slider_name">Meme5</h2>
              </div>
            </div>
          </div>
          <div class="slider-label">
            <label for="ctrl1" class="label checked"></label>
            <label for="ctrl2" class="label"></label>
            <label for="ctrl3" class="label"></label>
            <label for="ctrl4" class="label"></label>
            <label for="ctrl5" class="label"></label>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
